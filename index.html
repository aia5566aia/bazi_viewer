<!DOCTYPE html>

<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <title>八字・五行觀想助手 | AI繪圖提示詞生成</title>

    <!-- 引入 lunar-javascript 核心函式庫 (精確排盤) -->

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.8/lunar.min.js"></script>

    <!-- 圖表繪製用 Chart.js (CDN) -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>

        * {

            box-sizing: border-box;

            font-family: system-ui, 'Segoe UI', 'Noto Sans TC', '微軟正黑體', sans-serif;

        }

        body {

            background: linear-gradient(145deg, #e9f0e6 0%, #cfdec8 100%);

            margin: 0;

            padding: 24px 16px;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }

        .card {

            max-width: 680px;

            width: 100%;

            background: rgba(255, 255, 245, 0.95);

            border-radius: 48px 32px 48px 32px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);

            overflow: hidden;

            backdrop-filter: blur(0px);

            transition: all 0.2s ease;

        }

        .header {

            background: #2c4a2e;

            color: #fef7e0;

            padding: 28px 24px;

            text-align: center;

        }

        .header h1 {

            margin: 0 0 8px;

            font-size: 1.9rem;

            letter-spacing: 2px;

            font-weight: 500;

        }

        .header p {

            margin: 0;

            opacity: 0.85;

            font-size: 0.9rem;

        }

        .content {

            padding: 28px 24px 36px;

        }

        .form-group {

            margin-bottom: 20px;

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 12px;

        }

        .form-group label {

            font-weight: 600;

            width: 90px;

            color: #2f4d2d;

        }

        .form-group input, .form-group select {

            flex: 1;

            padding: 10px 14px;

            border: 1px solid #c0cfb2;

            border-radius: 28px;

            font-size: 1rem;

            background: white;

            transition: 0.2s;

        }

        .form-group input:focus, .form-group select:focus {

            outline: none;

            border-color: #5f8b4c;

            box-shadow: 0 0 0 3px rgba(79, 121, 66, 0.2);

        }

        .row-2col {

            display: flex;

            gap: 16px;

            flex-wrap: wrap;

        }

        .row-2col .form-group {

            flex: 1;

        }

        button {

            background: #3e6b3a;

            border: none;

            color: white;

            font-size: 1.1rem;

            font-weight: bold;

            padding: 12px 20px;

            border-radius: 40px;

            cursor: pointer;

            width: 100%;

            margin-top: 12px;

            transition: 0.2s;

            box-shadow: 0 2px 6px rgba(0,0,0,0.1);

        }

        button:hover {

            background: #2c5429;

            transform: scale(0.98);

        }

        .result-area {

            margin-top: 32px;

            background: #fefaf0;

            border-radius: 28px;

            padding: 20px;

            border: 1px solid #dbebce;

        }

        .bazi-text {

            background: #e9f0e2;

            padding: 12px 18px;

            border-radius: 28px;

            font-family: monospace;

            font-size: 1.3rem;

            font-weight: bold;

            text-align: center;

            letter-spacing: 4px;

            margin: 15px 0;

        }

        .radar-container {

            max-width: 260px;

            margin: 12px auto;

        }

        .prompt-box {

            background: #ffffffdd;

            border-left: 8px solid #5f8b4c;

            padding: 14px 18px;

            border-radius: 24px;

            margin: 24px 0 16px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.05);

            word-break: break-word;

            white-space: pre-wrap;

            font-size: 0.9rem;

            line-height: 1.5;

            color: #1f2a1b;

        }

        .flex-buttons {

            display: flex;

            gap: 14px;

            margin-top: 8px;

            flex-wrap: wrap;

        }

        .copy-btn {

            background: #5f6d5c;

            box-shadow: none;

            padding: 8px 12px;

            font-size: 0.85rem;

            width: auto;

            flex: 1;

        }

        .copy-btn:hover {

            background: #434f40;

        }

        .footnote {

            font-size: 0.7rem;

            text-align: center;

            margin-top: 28px;

            color: #5e6e55;

        }

        hr {

            margin: 20px 0;

            border-color: #d4e2ca;

        }

        .loading {

            text-align: center;

            padding: 20px;

            font-style: italic;

            color: #4c6b41;

        }

    </style>

</head>

<body>

<div class="card">

    <div class="header">

        <h1>🌳 八字・五行觀想助手</h1>

        <p>輸入生辰 · 精確排盤 · 生成AI繪圖提示詞</p>

    </div>

    <div class="content">

        <form id="baziForm">

            <div class="row-2col">

                <div class="form-group">

                    <label>出生年份</label>

                    <input type="number" id="year" value="1993" min="1900" max="2100" step="1">

                </div>

                <div class="form-group">

                    <label>月份</label>

                    <input type="number" id="month" value="9" min="1" max="12">

                </div>

            </div>

            <div class="row-2col">

                <div class="form-group">

                    <label>日期</label>

                    <input type="number" id="day" value="10" min="1" max="31">

                </div>

                <div class="form-group">

                    <label>時辰 (時)</label>

                    <input type="number" id="hour" value="8" min="0" max="23">

                </div>

            </div>

            <div class="form-group">

                <label>分鐘</label>

                <input type="number" id="minute" value="0" min="0" max="59">

            </div>

            <div class="form-group">

                <label>性別 (十神參考)</label>

                <select id="gender">

                    <option value="male">男</option>

                    <option value="female">女</option>

                </select>

            </div>

            <button type="submit">✨ 分析命盤・生成觀想提示詞 ✨</button>

        </form>



        <div id="resultPanel" class="result-area" style="display: none;">

            <h3 style="margin:0 0 8px; text-align:center;">📜 八字命盤</h3>

            <div id="baziDisplay" class="bazi-text">—</div>

            <p style="text-align:center; margin:5px 0"><strong>日主：</strong> <span id="dayMasterSpan">—</span> &nbsp;|&nbsp; <strong>五行缺失</strong> <span id="deficiencySpan">—</span></p>

            <div class="radar-container">

                <canvas id="radarChart" width="200" height="200" style="width:100%; height:auto; background: #fefcf5; border-radius: 20px;"></canvas>

            </div>

            

            <div class="prompt-box">

                <div style="font-weight:bold;">🎨 AI 繪圖提示詞 (複製到繪圖工具)</div>

                <div id="promptZhBox" style="margin: 12px 0 8px; background:#f2f6ed; padding:12px; border-radius:20px;">—</div>

                <div class="flex-buttons">

                    <button class="copy-btn" id="copyZhBtn">📋 複製中文提示詞</button>

                    <button class="copy-btn" id="copyEnBtn">🌐 Copy English Prompt</button>

                </div>

            </div>

            <hr />

            <div style="font-size:0.75rem; color:#5e6e55; text-align:center;">

                ⚡ 提示詞由五行缺失生成，可用於 Midjourney / DALL·E / Stable Diffusion。<br>

                🌿 本工具使用專業八字函式庫 lunar-javascript 精確排盤。

            </div>

        </div>

        <div class="footnote">

            ※ 出生時間建議使用「真太陽時」概念，本版未作經度校正，可自行依出生地微調時辰。<br>

             基於傳統子平八字，提供觀想輔助，用於自我療癒與創作靈感。

        </div>

    </div>

</div>

<script>

    // ----------------------------- 提示詞庫 (deficiency_key 對應) -------------------------

    const PROMPT_LIB = {

        // key 為排序後的五行缺字串 (例如 "木水" 代表缺木+缺水)

        "木": {

            zh: "🌲 第一人稱視角，赤腳站在茂密的森林中間，陽光透過樹葉灑下斑駁光影，周圍被高聳的樹木環繞，空氣濕潤清新，腳踩著鬆軟的泥土與青苔。畫面給人安定、扎根、生命力甦醒的感受。色調以翠綠、深綠與金黃光斑為主。",

            en: "First-person view, barefoot standing in a dense forest, sunlight filtering through leaves creating dappled light, surrounded by towering trees, moist and fresh air, feet on soft soil and moss. A scene of stability, grounding, and awakening vitality. Dominant colors: emerald green, deep green, golden light spots."

        },

        "水": {

            zh: "💧 第一人稱視角，赤腳站在寧靜湖泊的淺岸，湖水清澈見底，微微漣漪。遠方有淡淡晨霧，水面倒映著天空與遠山。象徵情緒流動、智慧清明、柔韌順應。整體色調為藍色、淡青色、銀白光。",

            en: "First-person view, barefoot standing on the gentle shore of a quiet lake, crystal clear water with slight ripples, distant morning mist, the water reflecting the sky and distant mountains. Symbolizing emotional flow, wisdom, and adaptability. Color palette: blue, light cyan, silver-white light."

        },

        "火": {

            zh: "🔥 第一人稱視角，站在遼闊草原或荒野，前方的地平線升起溫暖的橘紅色朝陽，光線柔和但充滿能量。溫暖的陽光照亮皮膚，遠方有淡淡霞光。代表行動力、創造力、熱情被點燃。色調以橘紅、琥珀色、暖金為主。",

            en: "First-person view, standing on vast grassland, a warm orange-red sunrise on the horizon, soft yet energetic light. The sunlight warms your skin, distant clouds glowing. Represents action, creativity, and passion ignited. Colors: orange-red, amber, warm gold."

        },

        "土": {

            zh: "⛰️ 第一人稱視角，赤腳踩在厚實的黃土或赭紅色大地上，四周開闊，遠處有沉穩的山巒。天空高遠，微風吹過。畫面傳遞穩定、承載、豐收與踏實感。色調為土黃、赭紅、大地色系。",

            en: "First-person view, barefoot on thick loess or reddish earth, open field with steady mountains in the distance. High sky, gentle breeze. Conveys stability, support, harvest, and groundedness. Colors: earthy yellow, ochre red, terracotta."

        },

        "金": {

            zh: "一般來說金不宜多補，此為平衡用。畫面轉為黃昏時的古銅色沙漠或金屬質感的光暈，夕陽與乾燥大地提醒放下過度剛硬與框架，學習柔軟。",

            en: "For balancing excess metal energy: a sunset over bronze-colored desert, metallic sheen on dunes, letting go of rigidity and embracing softness and flow."

        },

        "木水": {

            zh: "🌲💧 第一人稱視角，赤腳站在被蓊鬱森林環抱的小潭邊，潭水平靜澄澈，倒映著周圍綠樹與天空。腳下是柔軟的泥土與綠草，空氣中充滿木質清香與水氣，陽光合宜。一次性補足木與水的能量，產生扎根與流動並存的療癒感。色調以森林綠、湖水藍、泥土褐為主。",

            en: "First-person view, barefoot by a small pool surrounded by lush forest, the water calm and clear, reflecting trees and sky. Soft soil and grass underfoot, woody scent and moisture in the air, mild sunlight. Replenishes both Wood and Water energies, creating a healing sense of grounding and flow. Colors: forest green, lake blue, earth brown."

        },

        "木火": {

            zh: "🌲🔥 第一人稱視角，身處春日森林的空地，陽光穿透樹梢形成光柱，前方有溫馨的營火或溫暖光球，木與火交織，賦予生長與行動的動力。畫面充滿希望、活力與創造力。色調綠與橙紅交織。",

            en: "First-person view, in a forest clearing with sunlight beams through trees, a warm campfire or glowing orb ahead. Wood and fire interweave, supporting growth and action. Hopeful, energetic, creative. Colors: green and orange-red."

        },

        "水土": {

            zh: "💧⛰️ 第一人稱視角，站在濕潤的河岸旁，腳踩灰色軟泥與淺水，周圍有沉穩大地也有潺潺水流。中和大地的穩定與水的流動，利於財庫與情緒平衡。",

            en: "First-person view, standing on a moist riverbank, feet in soft gray mud and shallow water, surrounded by steady earth and flowing water. Balances stability of earth and flow of water, helping finance and emotional balance."

        },

        "火土": {

            zh: "🔥⛰️ 第一人稱視角，夕陽下的廣闊高原，赤腳踩在暖熱的紅土上，陽光把土地曬出溫暖能量。象徵行動後的回報、創造轉化為實質成果。",

            en: "First-person view, on a vast plateau at sunset, barefoot on warm red earth, sunlight heating the ground. Symbolizes reward after action, creativity turning into tangible results."

        },

        "水木火": {

            zh: "💧🌲🔥 融合湖泊森林與晨光的場景，赤腳站在水邊樹蔭下，陽光從樹葉間灑落水面。同時補水木火，讓流動、生長與行動和諧共融，適合需要全面療癒與前進動力的狀態。",

            en: "💧🌲🔥 A harmonious scene of forest lake with morning sunlight, barefoot under trees by the water. Replenishes Water, Wood, Fire together — suitable for holistic healing and forward momentum."

        }

    };

    // 通用默認 (若無匹配)

    const DEFAULT_PROMPT = {

        zh: "🌳 第一人稱視角，赤腳站在森林與湖泊之間的草地上，陽光柔暖，微風輕拂。讓身心回歸自然韻律，補充所需元氣。",

        en: "First-person view, barefoot on grass between forest and lake, soft warm sunlight, gentle breeze. Returning to natural rhythm, replenishing vital energy."

    };



    // 由八字計算五行分數 (天干+地支主氣權重)

    function calculateElementScores(lunar) {

        // 初始化五行分數: 木火土金水

        let scores = { "木":0, "火":0, "土":0, "金":0, "水":0 };

        // 天干權重

        const ganMap = { "甲": "木", "乙": "木", "丙": "火", "丁": "火", "戊": "土", "己": "土", "庚": "金", "辛": "金", "壬": "水", "癸": "水" };

        const eightChar = lunar.getEightChar();

        const ganArr = eightChar.getYearGan() + eightChar.getMonthGan() + eightChar.getDayGan() + eightChar.getTimeGan();

        for(let g of ganArr) {

            let el = ganMap[g];

            if(el) scores[el] += 1.0;

        }

        // 地支主氣 藏干各取主要 (子午卯酉為本氣, 其他取主氣)

        const zhiMain = {

            "子":"水","丑":"土","寅":"木","卯":"木","辰":"土","巳":"火",

            "午":"火","未":"土","申":"金","酉":"金","戌":"土","亥":"水"

        };

        const zhiArr = [ eightChar.getYearZhi(), eightChar.getMonthZhi(), eightChar.getDayZhi(), eightChar.getTimeZhi() ];

        for(let z of zhiArr) {

            let mainEl = zhiMain[z];

            if(mainEl) scores[mainEl] += 0.7;

        }

        return scores;

    }



    // 根據分數找出缺失五行 (低於閾值, 且特殊邏輯: 金過多不視為缺)

    function getDeficiency(scores) {

        let threshold = 1.2;   // 原始分數平均1~1.7之間 判定缺失<1.2

        let deficiency = [];

        // 木水通常最缺，金過旺不需補金

        let order = ["木","水","火","土"];

        for(let e of order) {

            if(scores[e] < threshold) deficiency.push(e);

        }

        // 若缺超過兩種，優先取最弱的兩種 (木水優先)

        if(deficiency.length > 2) {

            let sorted = [...deficiency].sort((a,b)=>scores[a]-scores[b]);

            deficiency = sorted.slice(0,2);

        }

        // 特殊情況: 如果金分數最高且缺木/水,維持主要提示為木水

        return deficiency;

    }



    // 取得提示詞 (根據缺什麼組合key)

    function getPrompts(deficiencyArr) {

        if(!deficiencyArr.length) deficiencyArr = ["木","水"]; // 中庸則補木水平衡

        let key = deficiencyArr.sort().join('');

        let promptObj = PROMPT_LIB[key];

        if(promptObj) return promptObj;

        // 嘗試拆解第一個缺失

        if(deficiencyArr.length>=1 && PROMPT_LIB[deficiencyArr[0]]) return PROMPT_LIB[deficiencyArr[0]];

        return DEFAULT_PROMPT;

    }



    // 繪製雷達圖

    let chartInstance = null;

    function drawRadar(scores) {

        const ctx = document.getElementById('radarChart').getContext('2d');

        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {

            type: 'radar',

            data: {

                labels: ['木 (Wood)', '火 (Fire)', '土 (Earth)', '金 (Metal)', '水 (Water)'],

                datasets: [{

                    label: '五行能量強度',

                    data: [scores["木"], scores["火"], scores["土"], scores["金"], scores["水"]],

                    backgroundColor: 'rgba(86, 128, 75, 0.25)',

                    borderColor: '#3e6b3a',

                    borderWidth: 2,

                    pointBackgroundColor: '#2c4a2e',

                    pointBorderColor: '#fff',

                    pointRadius: 4

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: true,

                scales: { r: { min: 0, max: 3.5, ticks: { stepSize: 0.5, backdropColor: 'transparent' } } },

                plugins: { tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw.toFixed(2)}` } } }

            }

        });

    }



    // 主要分析函數

    function analyzeAndGenerate(year, month, day, hour, minute, gender) {

        try {

            // 使用 lunar-javascript 建立精確八字物件 (已內建節氣、月令分日)

            // 注意月份範圍調整為常規日期

            let lunarDate = Lunar.fromYmdHms(year, month, day, hour, minute, 0);

            let eightChar = lunarDate.getEightChar();

            let baziStr = `${eightChar.getYear()} ${eightChar.getMonth()} ${eightChar.getDay()} ${eightChar.getTime()}`;

            let dayMaster = eightChar.getDayGan();   // 日主

            

            // 計算五行分數

            let scores = calculateElementScores(lunarDate);

            let deficiency = getDeficiency(scores);

            

            // 提示詞

            let promptData = getPrompts(deficiency);

            let promptZh = promptData.zh;

            let promptEn = promptData.en;

            

            // 更新DOM

            document.getElementById('baziDisplay').innerText = baziStr;

            document.getElementById('dayMasterSpan').innerText = `${dayMaster} (${dayMaster === '甲'||dayMaster === '乙'?'木': (dayMaster === '丙'||dayMaster === '丁'?'火': (dayMaster === '戊'||dayMaster === '己'?'土': (dayMaster === '庚'||dayMaster === '辛'?'金':'水'))))}`;

            let deficiencyText = deficiency.length ? deficiency.join('、') : '五行平衡 (建議補木水平衡)';

            document.getElementById('deficiencySpan').innerHTML = deficiencyText;

            document.getElementById('promptZhBox').innerHTML = promptZh;

            // 儲存到全域變數供複製

            window.currentPromptZh = promptZh;

            window.currentPromptEn = promptEn;

            

            drawRadar(scores);

            document.getElementById('resultPanel').style.display = 'block';

        } catch(e) {

            alert("計算錯誤，請檢查年月日是否正確或有特殊節氣衝突。"+e.message);

            console.error(e);

        }

    }



    // 綁定UI

    const form = document.getElementById('baziForm');

    form.addEventListener('submit', (e) => {

        e.preventDefault();

        let year = parseInt(document.getElementById('year').value);

        let month = parseInt(document.getElementById('month').value);

        let day = parseInt(document.getElementById('day').value);

        let hour = parseInt(document.getElementById('hour').value);

        let minute = parseInt(document.getElementById('minute').value);

        let gender = document.getElementById('gender').value;

        if(year<1900||year>2100) { alert("年份須為1900-2100"); return; }

        analyzeAndGenerate(year, month, day, hour, minute, gender);

    });



    // 複製功能

    document.getElementById('copyZhBtn')?.addEventListener('click', ()=>{

        if(window.currentPromptZh) {

            navigator.clipboard.writeText(window.currentPromptZh);

            alert("✓ 中文提示詞已複製，可貼至AI繪圖工具！");

        } else alert("請先分析八字產生提示詞");

    });

    document.getElementById('copyEnBtn')?.addEventListener('click', ()=>{

        if(window.currentPromptEn) {

            navigator.clipboard.writeText(window.currentPromptEn);

            alert("✓ English prompt copied to clipboard!");

        } else alert("Please generate prompt first.");

    });

    // 預設載入一次展示 (1993/9/10 8:00 新北市)

    window.addEventListener('load', ()=>{

        analyzeAndGenerate(1993,9,10,8,0,"male");

    });

</script>

</body>

</html>
